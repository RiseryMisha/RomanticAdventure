<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Adventure - Mexico Route</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2b1810;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .game-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: #1a0f0a;
            overflow: hidden;
            position: relative;
        }

        /* Левая часть: Карта */
        .map-section {
            position: relative;
            flex-grow: 1;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .map-image {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            display: block;
        }

        .route-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .route-line-pending {
            fill: none;
            stroke: #ff3333;
            stroke-width: 3;
            stroke-dasharray: 6, 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px #ff0000);
        }

        .route-line-completed {
            fill: none;
            stroke: #00bfff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px #00bfff);
        }

        /* Правая боковая панель */
        .sidebar {
            width: 380px;
            background: #2b1810;
            border-left: 3px solid #d4af37;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: #f4e8c1;
            z-index: 20;
            box-shadow: -5px 0 20px rgba(0,0,0,0.6);
            overflow-y: auto;
        }

        .sidebar h1 {
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
        }

        .progress-container {
            background: #3b2219;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #b8860b;
        }

        .progress-text {
            font-size: 13px;
            margin-bottom: 6px;
            text-align: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #20100a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #b8860b;
        }

        .progress-bar-fill {
            height: 100%;
            background: #d4af37;
            width: 0%;
            transition: width 0.4s ease;
        }

        .location-card {
            background: #3b2219;
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .location-card h2 {
            font-size: 16px;
            color: #f4e8c1;
            text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .location-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        .location-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: #e6d2a5;
            overflow-y: auto;
            max-height: 30vh;
            padding-right: 5px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .action-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .action-btn {
            display: block;
            width: 100%;
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        .action-btn:hover {
            background: #a00000;
            transform: scale(1.02);
        }

        .action-btn.secondary-btn {
            background: #5c3a21;
            border: 1px solid #d4af37;
            font-size: 12px;
            padding: 8px;
        }

        .action-btn.secondary-btn:hover {
            background: #704729;
        }

        .action-btn.completed-status {
            background: #2e7d32;
            cursor: default;
            transform: none;
        }

        .action-btn.locked-status {
            background: #795548;
            cursor: not-allowed;
            transform: none;
        }

        /* Модальные окна */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-window {
            width: 825px;
            max-width: 95vw;
            min-height: 480px;
            max-height: 90vh;
            background: #f4e8c1;
            background-image: linear-gradient(to bottom, #fdf6e2, #e6d2a5);
            border: 4px solid #b8860b;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            color: #2b1810;
            animation: modalAppear 0.3s ease-out;
        }

        @keyframes modalAppear {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 26px;
            font-weight: bold;
            color: #8b0000;
            cursor: pointer;
            z-index: 10;
        }

        .modal-header h2 {
            font-size: 22px;
            color: #8b0000;
            margin-bottom: 20px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
            text-align: center;
        }

        .modal-body {
            font-size: 15px;
            line-height: 1.6;
            color: #3b2219;
            margin-bottom: 20px;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .quiz-question-block {
            background: rgba(139, 0, 0, 0.05);
            border: 1px solid #b8860b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .quiz-question-block p {
            font-weight: bold;
            margin-bottom: 15px;
            color: #5c1d1d;
            font-size: 18px;
        }

        .quiz-options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }

        .quiz-options label:hover {
            color: #8b0000;
        }

        .quiz-options input {
            margin-right: 12px;
            accent-color: #8b0000;
            transform: scale(1.2);
        }

        .error-msg {
            color: #8b0000;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
            display: none;
        }

        /* Стили для Шифров (Локация 3) */
        .cipher-card {
            background: rgba(139, 0, 0, 0.04);
            border: 1px solid #b8860b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .cipher-card h3 {
            color: #8b0000;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .cipher-text {
            font-family: monospace;
            background: #fff3d1;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px dashed #b8860b;
            margin: 6px 0;
            font-size: 14px;
            word-break: break-all;
        }

        .cipher-hint {
            font-style: italic;
            color: #5c4033;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .cipher-input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .cipher-input {
            flex-grow: 1;
            padding: 8px 12px;
            border: 1px solid #b8860b;
            border-radius: 4px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            background: #fff;
            color: #2b1810;
        }

        .cipher-check-btn {
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .cipher-check-btn:hover {
            background: #a00000;
        }

        .cipher-status {
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }

        .cipher-status.success {
            color: #2e7d32;
        }

        .cipher-status.error {
            color: #8b0000;
        }

        /* Стили для Маджонга */
        .mahjong-board {
            position: relative;
            width: 100%;
            height: 380px;
            background: #2b1810;
            border: 2px solid #b8860b;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mahjong-arena {
            position: relative;
            width: 710px;
            height: 350px;
        }

        .mj-tile {
            position: absolute;
            width: 38px;
            height: 48px;
            background: linear-gradient(135deg, #fdf6e2 0%, #e6d2a5 100%);
            border: 2px solid #8b6508;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.4);
            user-select: none;
            transition: transform 0.1s, border-color 0.1s, background 0.1s;
        }

        .mj-tile:hover {
            border-color: #8b0000;
            transform: translateY(-2px);
        }

        .mj-tile.selected {
            border-color: #ff4500;
            background: #fff8dc;
            box-shadow: 0 0 10px #ff4500;
            transform: translateY(-4px);
        }

        .mj-tile.matched {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .mj-tile.blocked {
            filter: brightness(0.65);
            cursor: not-allowed;
        }

        .mahjong-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: bold;
            color: #5c1d1d;
        }

        /* Чекпоинты на карте */
        .checkpoint {
            position: absolute;
            width: 75px;
            height: 75px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s ease;
            z-index: 10;
            background: transparent;
            border: none;
        }

        .checkpoint img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        .checkpoint span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            display: none;
        }

        .checkpoint img:not([src]), .checkpoint img[src=""] {
            display: none;
        }

        .checkpoint.locked {
            cursor: not-allowed;
        }

        .checkpoint:not(.locked):hover {
            transform: translate(-50%, -50%) scale(1.3);
            z-index: 20;
        }

        .cp-1  { top: 76.4%; left: 61.5%; }

        .cp-24 { top: 10.9%; left: 8.1%;  }
    </style>
</head>

        function updateProgressUI() {
            let completedCount = currentStep - 1;
            let percent = Math.round((completedCount / 24) * 100);
            document.getElementById('progressText').innerText = `Пройдено: ${completedCount} из 24 (${percent}%)`;
            document.getElementById('progressBarFill').style.width = `${percent}%`;
        }

        function typeWriterEffect(text, elementId, i = 0) {
            if (i === 0) {
                document.getElementById(elementId).innerText = "";
            }
            if (i < text.length) {
                document.getElementById(elementId).innerText += text.charAt(i);
                typewriterTimeout = setTimeout(() => typeWriterEffect(text, elementId, i + 1), 15);
            }
        }

        function selectLocation(step) {
            selectedStep = step;
            const data = locationsData[step];
            if (!data) return;

            document.getElementById('sidebar-title').innerText = data.title;
            
            const sidebarImg = document.getElementById('sidebar-img');
            sidebarImg.style.display = 'block';
            sidebarImg.src = `Icons/${step}.png`;

            if (typewriterTimeout) clearTimeout(typewriterTimeout);
            typeWriterEffect(data.history, 'sidebar-desc', 0);

            let actionHTML = "";
            if (step === currentStep && currentStep <= 24) {
                if (step === 1) {
                    actionHTML = `<button class="action-btn" onclick="startQuiz()">Start Quiz ➔</button>`;
                } else if (step === 2) {

                actionHTML += `<button class="action-btn secondary-btn" onclick="promptPassword(${step})">🔑 Ввести пароль</button>`;

            } else {

        function renderQuizQuestion() {
            const q = quizQuestions[currentQuizIndex];
            document.getElementById('modal-title').innerText = `Stage 1 Quiz (Question ${currentQuizIndex + 1} of ${quizQuestions.length})`;
            
            let htmlContent = `<div class="quiz-question-block">`;
            htmlContent += `<p>${q.question}</p>`;
            htmlContent += `<div class="quiz-options">`;
            
            q.options.forEach((opt, idx) => {
                let inputId = `q_opt_${idx}`;
                htmlContent += `<label for="${inputId}"><input type="${q.type}" name="currentQuizOpt" value="${idx}" id="${inputId}"> ${opt.emoji} ${opt.text}</label>`;
            });
            
            htmlContent += `</div></div>`;

            document.getElementById('modal-content').innerHTML = htmlContent;
            document.getElementById('errorMsg').style.display = 'none';

            let btnText = (currentQuizIndex === quizQuestions.length - 1) ? "Finish Quiz ➔" : "Next Question ➔";
            document.getElementById('modal-action').innerHTML = `<button class="action-btn" onclick="verifyCurrentQuestion()">${btnText}</button>`;
        }

        function verifyCurrentQuestion() {
            const q = quizQuestions[currentQuizIndex];
            const inputs = document.querySelectorAll(`[name="currentQuizOpt"]`);
            let isCorrect = true;

            if (q.type === 'radio') {
                let answeredCorrectly = false;
                inputs.forEach((input, idx) => {
                    if (input.checked && q.options[idx].correct) answeredCorrectly = true;
                });
                if (!answeredCorrectly) isCorrect = false;
            } else if (q.type === 'checkbox') {
                inputs.forEach((input, idx) => {
                    let shouldBeChecked = q.options[idx].correct;
                    if (input.checked !== shouldBeChecked) isCorrect = false;
                });
            }

            const errorMsg = document.getElementById('errorMsg');
            if (!isCorrect) {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            currentQuizIndex++;

            if (currentQuizIndex < quizQuestions.length) {
                renderQuizQuestion();
            } else {
                if (currentStep < 24) {
                    currentStep++;
                    localStorage.setItem('mexicoRouteProgress', currentStep);
                }
                closeModal();
                updateProgressUI();
                updateMapDisplay();
                selectLocation(currentStep);
            }
        }

        function renderCiphersModal() {

            ciphersData.forEach((item, index) => {
                html += `
                    <div class="cipher-card" id="cipher-card-${item.id}">
                        <h3>${item.name}</h3>
                        <div class="cipher-text">${item.encrypted}</div>
                        <div class="cipher-hint">Hint: ${item.hint}</div>
                        <div class="cipher-input-group">
                            <input type="text" class="cipher-input" id="cipher-input-${item.id}" placeholder="Type decoded phrase..." ${item.solved ? 'value="' + item.answer + '" disabled' : ''}>

                        </div>
                        <div class="cipher-status" id="cipher-status-${item.id}">${item.solved ? '✅ Solved!' : ''}</div>
                    </div>
                `;
            });

            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('errorMsg').style.display = 'none';
            
            let allSolved = ciphersData.every(c => c.solved);
            let actionBtnHtml = allSolved ? `<button class="action-btn" onclick="completeCiphersStage()">Continue Journey ➔</button>` : `<button class="action-btn locked-status">🔓 Solve all ciphers to proceed</button>`;
            document.getElementById('modal-action').innerHTML = actionBtnHtml;
        }

        function checkCipher(id) {
            const item = ciphersData.find(c => c.id === id);
            const inputVal = document.getElementById(`cipher-input-${id}`).value.trim();
            const statusEl = document.getElementById(`cipher-status-${id}`);

            // Нормализуем сравнение (игнорируем регистр и лишние пробелы/апострофы для удобства)
            const normalize = str => str.toLowerCase().replace(/['‘’]/g, "'").replace(/\s+/g, ' ').trim();

            if (normalize(inputVal) === normalize(item.answer)) {
                item.solved = true;
                statusEl.className = "cipher-status success";
                statusEl.innerText = "✅ Solved!";
                
                // Блокируем инпут
                document.getElementById(`cipher-input-${id}`).disabled = true;
                const btn = document.querySelector(`#cipher-card-${id} .cipher-check-btn`);
                if (btn) btn.style.display = 'none';

                // Проверяем, все ли решены
                if (ciphersData.every(c => c.solved)) {
                    document.getElementById('modal-action').innerHTML = `<button class="action-btn" onclick="completeCiphersStage()">Continue Journey ➔</button>`;
                }
            } else {
                statusEl.className = "cipher-status error";
                statusEl.innerText = "❌ Incorrect, try again!";
            }
        }

        function completeCiphersStage() {
            alert("🎉 Невероятно! Все шифры успешно разгаданы, Пуэбла покорена!");
            if (currentStep === 3 && currentStep < 24) {
                currentStep++;
                localStorage.setItem('mexicoRouteProgress', currentStep);
            }
            closeModal();
            updateProgressUI();
            updateMapDisplay();
            selectLocation(currentStep);
        }

        // --- МАДЖОНГ (Локация 2) ---
        function startMahjongGame() {
            mjShuffleUsed = false;
            mjSelectedTile = null;
            generateSolvableMahjong();
            renderMahjongModal();
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Правило блокировки плитки (единое и для генерации, и для игры — это и даёт гарантию прохождения):
        // 1) плитка закрыта, если сверху лежит другая непройденная плитка;
        // 2) плитка закрыта, если она зажата ОДНОВРЕМЕННО и слева, и справа соседними плитками (классическое маджонг-правило).
        function isBlockedAmong(tile, tiles) {
            for (let i = 0; i < tiles.length; i++) {
                const other = tiles[i];
                if (other.id === tile.id) continue;
                if (other.layer > tile.layer && Math.abs(other.x - tile.x) < 32 && Math.abs(other.y - tile.y) < 42) {
                    return true;
                }
            }
            let leftBlocked = false;
            let rightBlocked = false;
            for (let i = 0; i < tiles.length; i++) {
                const other = tiles[i];
                if (other.id === tile.id) continue;
                if (other.layer < tile.layer) continue;
                if (Math.abs(other.y - tile.y) < 20) {
                    const dx = other.x - tile.x;
                    if (dx < 0 && dx > -44) leftBlocked = true;
                    if (dx > 0 && dx < 44) rightBlocked = true;
                }
            }
            return leftBlocked && rightBlocked;
        }

        // Строит последовательность "снятия" плиток по геометрии tiles (id/x/y/layer)
        // и раздаёт парные символы в этом порядке — так пара всегда становится доступной одновременно.
        function assignSolvableSymbols(tiles) {
            let pool = tiles.map(t => ({ id: t.id, x: t.x, y: t.y, layer: t.layer }));
            let removalOrder = [];

            while (pool.length > 0) {
                let freeIdx = [];
                for (let i = 0; i < pool.length; i++) {
                    if (!isBlockedAmong(pool[i], pool)) freeIdx.push(i);
                }
                if (freeIdx.length === 0) freeIdx = pool.map((_, idx) => idx);
                let i1 = freeIdx[Math.floor(Math.random() * freeIdx.length)];
                let t1 = pool[i1];
                pool.splice(i1, 1);

                let freeIdx2 = [];
                for (let i = 0; i < pool.length; i++) {
                    if (!isBlockedAmong(pool[i], pool)) freeIdx2.push(i);
                }
                if (freeIdx2.length === 0) freeIdx2 = pool.map((_, idx) => idx);
                let i2 = freeIdx2[Math.floor(Math.random() * freeIdx2.length)];
                let t2 = pool[i2];
                pool.splice(i2, 1);

                removalOrder.push(t1.id, t2.id);
            }

            let symbolMap = {};
            let iconIdx = 0;
            for (let i = 0; i < removalOrder.length; i += 2) {
                const symbol = mjIcons[iconIdx % mjIcons.length];
                iconIdx++;
                symbolMap[removalOrder[i]] = symbol;
                symbolMap[removalOrder[i + 1]] = symbol;
            }
            return symbolMap;
        }

        function generateSolvableMahjong() {
            let rawPositions = [];
            let index = 0;
            const tileW = 40;
            const tileH = 50;

            // 4 слоя вместо почти-плоских 2: больше нахлёста и глубины — сложнее находить свободные пары
            let layersConfig = [
                { rows: 6, colsBase: 9, startX: 20,  startY: 10 },
                { rows: 5, colsBase: 7, startX: 50,  startY: 35 },
                { rows: 3, colsBase: 5, startX: 90,  startY: 60 },
                { rows: 2, colsBase: 2, startX: 130, startY: 85 }
            ];

            layersConfig.forEach((cfg, layerIdx) => {
                let currentCols = cfg.colsBase;
                for (let r = 0; r < cfg.rows; r++) {
                    for (let c = 0; c < currentCols; c++) {
                        if (index < 80) {
                            rawPositions.push({
                                id: index,
                                x: cfg.startX + c * (tileW + 2) + (r * 6),
                                y: cfg.startY + r * (tileH + 2),
                                layer: layerIdx
                            });
                            index++;
                        }
                    }
                    if (currentCols > 2) currentCols--;
                }
            });

            while (index < 80) {
                rawPositions.push({
                    id: index,
                    x: 250 + (index % 5) * 42,
                    y: 120 + Math.floor(index / 5) * 52,
                    layer: 0
                });
                index++;
            }

            const symbolMap = assignSolvableSymbols(rawPositions);

            mjTilesData = rawPositions.map(p => ({
                id: p.id,
                x: p.x,
                y: p.y,
                layer: p.layer,
                symbol: symbolMap[p.id] || mjIcons[0],
                matched: false
            }));
        }

        function isTileBlocked(tile) {
            if (tile.matched) return true;
            const activeTiles = mjTilesData.filter(t => !t.matched);
            return isBlockedAmong(tile, activeTiles);
        }

        function renderMahjongModal() {
            document.getElementById('modal-title').innerText = "Stage 2: Iztaccihuatl Volcano Mahjong";
            let remaining = mjTilesData.filter(t => !t.matched).length;

            let html = `
                <div class="mahjong-info">
                    <span>Осталось плиток: <span id="mjCount">${remaining}</span> / 80</span>
                    <button class="action-btn secondary-btn" style="width: auto; padding: 6px 12px;" onclick="shuffleMahjongTiles()" ${mjShuffleUsed ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>🔀 Перемешать (${mjShuffleUsed ? 0 : 1})</button>
                </div>
                <div class="mahjong-board">
                    <div class="mahjong-arena" id="mjArena">
            `;

            mjTilesData.forEach(tile => {
                let blocked = isTileBlocked(tile);
                let classes = `mj-tile ${tile.matched ? 'matched' : ''} ${blocked && !tile.matched ? 'blocked' : ''}`;
                html += `<div class="${classes}" style="left: ${tile.x}px; top: ${tile.y}px; z-index: ${tile.layer * 10};" onclick="handleTileClick(${tile.id})">${tile.symbol}</div>`;
            });

            html += `</div></div>`;

            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('modal-action').innerHTML = ``;
        }

        function handleTileClick(id) {
            let tile = mjTilesData.find(t => t.id === id);
            if (!tile || tile.matched || isTileBlocked(tile)) return;

            let el = document.querySelectorAll('.mj-tile')[id];

            if (mjSelectedTile === null) {
                mjSelectedTile = tile;
                el.classList.add('selected');
            } else if (mjSelectedTile.id === tile.id) {
                mjSelectedTile = null;
                el.classList.remove('selected');
            } else {
                if (mjSelectedTile.symbol === tile.symbol) {
                    mjSelectedTile.matched = true;
                    tile.matched = true;
                    mjSelectedTile = null;

                    renderMahjongModal();

                    let leftOver = mjTilesData.filter(t => !t.matched).length;
                    if (leftOver === 0) {
                        setTimeout(() => {
                            alert("🎉 Великолепно! Вулкан покорен, маджонг пройден!");
                            if (currentStep === 2 && currentStep < 24) {
                                currentStep++;
                                localStorage.setItem('mexicoRouteProgress', currentStep);
                            }
                            closeModal();
                            updateProgressUI();
                            updateMapDisplay();
                            selectLocation(currentStep);
                        }, 300);
                    }
                } else {
                    let prevEl = document.querySelectorAll('.mj-tile')[mjSelectedTile.id];
                    if (prevEl) prevEl.classList.remove('selected');
                    mjSelectedTile = tile;
                    el.classList.add('selected');
                }
            }
        }

        function shuffleMahjongTiles() {
            if (mjShuffleUsed) return;
            mjShuffleUsed = true;
            mjSelectedTile = null;

            let unmatched = mjTilesData.filter(t => !t.matched);
            const symbolMap = assignSolvableSymbols(unmatched.map(t => ({ id: t.id, x: t.x, y: t.y, layer: t.layer })));
            unmatched.forEach(t => {
                t.symbol = symbolMap[t.id];
            });

            renderMahjongModal();
        }

        function completeStepDirectly(step) {
            if (currentStep < 24) {
                currentStep++;
                localStorage.setItem('mexicoRouteProgress', currentStep);
            }
            updateProgressUI();
            updateMapDisplay();
            selectLocation(currentStep);
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOutside(event) {
            if (event.target.id === 'modalOverlay') {
                closeModal();
            }
        }

        function updateMapDisplay() {
            const container = document.getElementById('mapContainer');
            const rect = container.getBoundingClientRect();
            let allPoints = [];
            
            for (let i = 1; i <= 24; i++) {
                const cp = container.querySelector(`.cp-${i}`);
                if (cp) {
                    const cpRect = cp.getBoundingClientRect();
                    const x = (cpRect.left + cpRect.width / 2) - rect.left;
                    const y = (cpRect.top + cpRect.height / 2) - rect.top;
                    allPoints.push({ x, y });

                    cp.classList.remove('locked');
                    if (i > currentStep) {
                        cp.classList.add('locked');
                    }
                }
            }

            let pendingStr = allPoints.map(p => `${p.x},${p.y}`).join(' ');
            document.getElementById('routePending').setAttribute('points', pendingStr);

            let completedPoints = allPoints.slice(0, currentStep);
            let completedStr = completedPoints.map(p => `${p.x},${p.y}`).join(' ');
            document.getElementById('routeCompleted').setAttribute('points', completedStr);
        }

        window.addEventListener('load', () => {
            updateProgressUI();
            updateMapDisplay();
            selectLocation(currentStep);
        });
        window.addEventListener('resize', updateMapDisplay);
        setTimeout(updateMapDisplay, 150);
    </script>
