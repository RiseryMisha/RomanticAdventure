<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Adventure - Mexico Route</title>
    <style>
        <link rel="stylesheet" href="css/style.css">
    </style>
</head>
<body>

    <div class="game-layout">
        <!-- Карта -->
        <div class="map-section" id="mapContainer">
            <img src="BingAIGC.jpg" alt="Map of Mexico" class="map-image" id="mapImg">

            <svg class="route-svg">
                <polyline id="routePending" class="route-line-pending" points="" />
                <polyline id="routeCompleted" class="route-line-completed" points="" />
            </svg>

            <!-- 24 Чекпоинта -->
            <div class="checkpoint cp-1" onclick="selectLocation(1)"><img src="Icons/1.png" alt="1" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>1</span></div>
            <div class="checkpoint cp-2" onclick="selectLocation(2)"><img src="Icons/2.png" alt="2" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>2</span></div>
            <div class="checkpoint cp-3" onclick="selectLocation(3)"><img src="Icons/3.png" alt="3" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>3</span></div>
            <div class="checkpoint cp-4" onclick="selectLocation(4)"><img src="Icons/4.png" alt="4" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>4</span></div>
            <div class="checkpoint cp-5" onclick="selectLocation(5)"><img src="Icons/5.png" alt="5" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>5</span></div>
            <div class="checkpoint cp-6" onclick="selectLocation(6)"><img src="Icons/6.png" alt="6" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>6</span></div>
            <div class="checkpoint cp-7" onclick="selectLocation(7)"><img src="Icons/7.png" alt="7" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>7</span></div>
            <div class="checkpoint cp-8" onclick="selectLocation(8)"><img src="Icons/8.png" alt="8" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>8</span></div>
            <div class="checkpoint cp-9" onclick="selectLocation(9)"><img src="Icons/9.png" alt="9" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>9</span></div>
            <div class="checkpoint cp-10" onclick="selectLocation(10)"><img src="Icons/10.png" alt="10" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>10</span></div>
            <div class="checkpoint cp-11" onclick="selectLocation(11)"><img src="Icons/11.png" alt="11" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>11</span></div>
            <div class="checkpoint cp-12" onclick="selectLocation(12)"><img src="Icons/12.png" alt="12" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>12</span></div>
            <div class="checkpoint cp-13" onclick="selectLocation(13)"><img src="Icons/13.png" alt="13" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>13</span></div>
            <div class="checkpoint cp-14" onclick="selectLocation(14)"><img src="Icons/14.png" alt="14" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>14</span></div>
            <div class="checkpoint cp-15" onclick="selectLocation(15)"><img src="Icons/15.png" alt="15" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>15</span></div>
            <div class="checkpoint cp-16" onclick="selectLocation(16)"><img src="Icons/16.png" alt="16" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>16</span></div>
            <div class="checkpoint cp-17" onclick="selectLocation(17)"><img src="Icons/17.png" alt="17" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>17</span></div>
            <div class="checkpoint cp-18" onclick="selectLocation(18)"><img src="Icons/18.png" alt="18" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>18</span></div>
            <div class="checkpoint cp-19" onclick="selectLocation(19)"><img src="Icons/19.png" alt="19" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>19</span></div>
            <div class="checkpoint cp-20" onclick="selectLocation(20)"><img src="Icons/20.png" alt="20" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>20</span></div>
            <div class="checkpoint cp-21" onclick="selectLocation(21)"><img src="Icons/21.png" alt="21" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>21</span></div>
            <div class="checkpoint cp-22" onclick="selectLocation(22)"><img src="Icons/22.png" alt="22" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>22</span></div>
            <div class="checkpoint cp-23" onclick="selectLocation(23)"><img src="Icons/23.png" alt="23" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>23</span></div>
            <div class="checkpoint cp-24" onclick="selectLocation(24)"><img src="Icons/24.png" alt="24" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span>24</span></div>
        </div>

        <!-- Правая панель -->
        <div class="sidebar">
            <h1>Romantic Adventure</h1>
            
            <div class="progress-container">
                <div class="progress-text" id="progressText">Пройдено: 1 из 24 (4%)</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <button class="action-btn secondary-btn" style="margin-bottom:15px;" onclick="resetProgress()">🔄 Сбросить прогресс (dev)</button>

            <div class="location-card">
                <h2 id="sidebar-title">Выберите этап</h2>
                <img id="sidebar-img" class="location-img" src="" alt="Icon" style="display: none;">
                <div class="location-desc" id="sidebar-desc">Нажмите на любую доступную точку на карте, чтобы узнать историю места.</div>
                <div class="action-buttons-group" id="sidebar-action"></div>
            </div>
        </div>

        <!-- Модальное окно для заданий -->
        <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
            <div class="modal-window">
                <button class="modal-close" onclick="closeModal()">×</button>
                <div class="modal-header">
                    <h2 id="modal-title">Stage</h2>
                </div>
                <div class="modal-body" id="modal-content">
                    <!-- Содержимое задания -->
                </div>
                <div id="errorMsg" class="error-msg">Incorrect answer. Please try again!</div>
                <div id="modal-action">
                    <!-- Кнопки управления -->
                </div>
            </div>
        </div>
    </div>

    <script>
        <script src="js/app.js"></script>
    </script>
</body>
</html>
